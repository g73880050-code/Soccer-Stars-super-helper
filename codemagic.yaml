# =============================================================================
# Soccer Stars Analyzer — Codemagic CI/CD  (production-ready)
# =============================================================================
#
# Issues fixed
# ────────────
#   1. PEP 517 isolated-env failure
#        Root cause : pip spawns a clean venv for every recipe that uses
#                     PEP 517 build; Cython is not visible inside that venv.
#        Fix        : PIP_NO_BUILD_ISOLATION=1 set at the workflow level so
#                     every subprocess pip call inherits it, PLUS Cython is
#                     pre-installed globally (Step 4) before p4a ever runs.
#
#   2. Build pollution from old runs
#        Fix        : "Clean Room" step (Step 3) hard-deletes ./build,
#                     ./.python-for-android, ./dist, ./bin, Gradle caches,
#                     and the pip wheel cache before any new compilation.
#
#   3. Dependency version drift
#        Fix        : Every critical package is hard-pinned.
#                     pip/setuptools/wheel/Cython/p4a/Kivy/NumPy all use
#                     explicit ==X.Y.Z versions.  No surprise upgrades.
#
#   4. OpenCV C++ recompilation (40-60 min, frequent NDK failures)
#        Fix        : Custom recipe in p4a_recipes/opencv/ uses the official
#                     pre-built Android SDK .so files.  Only the thin cv2.so
#                     Python extension is cross-compiled (~3-5 min total).
#                     See p4a_recipes/opencv/__init__.py for full details.
#
#   5. NumPy cross-compilation loop
#        Fix        : Pre-built arm64-v8a wheel in ./wheels/ is registered
#                     with PIP_FIND_LINKS and passed to p4a via --wheels.
#
# Instance choice
# ───────────────
#   linux_x2 instead of mac_mini_m1.
#   Android NDK binaries are Linux x86_64 ELFs; running them on macOS adds
#   an extra Rosetta layer and ~40% overhead.  linux_x2 also mirrors the
#   project Dockerfile (Ubuntu 22.04) exactly.
#
# Workflows
# ─────────
#   android-debug    fast, no signing — use for PRs / iteration
#   android-release  signed APK — use for Play Store / distribution
# =============================================================================

workflows:

  # ═══════════════════════════════════════════════════════════════════════════
  # Debug workflow
  # ═══════════════════════════════════════════════════════════════════════════
  android-debug:
    name: "Soccer Stars — Android Debug"
    instance_type: linux
    max_build_duration: 120   # minutes; opencv download+cv2 compile ≈ 20 min

    environment:
      vars:
        # ── Android SDK / NDK  (frozen to match Dockerfile) ────────────────
        ANDROID_HOME:         /home/user/android-sdk
        ANDROID_SDK_ROOT:     /home/user/android-sdk
        ANDROID_NDK_HOME:     /home/user/android-sdk/ndk/25.1.8937393
        ANDROIDNDK:           /home/user/android-sdk/ndk/25.1.8937393
        ANDROIDAPI:           "33"
        ANDROIDMINAPI:        "26"
        ANDROIDNDKAPI:        "26"
        ANDROID_NDK_API:      "26"

        # ── Pinned versions ─────────────────────────────────────────────────
        # Cython 3.0.x — 3.1+ breaks several p4a recipes (kivy, pyjnius)
        CYTHON_VERSION:       "3.0.10"
        # p4a 2024.1.21 — last stable release with SDL2 + Kivy 2.3 support
        P4A_VERSION:          "2024.1.21"
        KIVY_VERSION:         "2.3.0"
        NUMPY_VERSION:        "1.26.4"

        # ── p4a runtime flags ───────────────────────────────────────────────
        P4A_FORCE_YES:              "1"
        P4A_NO_PREREQUISITE_CHECK:  "1"

        # ── THE KEY FIX: disable PEP 517 isolated environments ─────────────
        # pip (and every pip subprocess p4a spawns internally) will skip
        # creating an isolated venv, meaning globally installed Cython and
        # setuptools are always visible — no more ModuleNotFoundError.
        PIP_NO_BUILD_ISOLATION: "1"

        # Pre-built wheel lookup: pip checks ./wheels/ before hitting PyPI.
        # The arm64-v8a numpy wheel lives here; also consumed by --wheels.
        PIP_FIND_LINKS: "./wheels"

        # ccache dramatically speeds up repeated compilations (cv2.so, etc.)
        USE_CCACHE: "1"
        CCACHE_DIR: "/tmp/ccache"

        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    scripts:

      # ── 1 · System packages ───────────────────────────────────────────────
      - name: "1 · System packages"
        script: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk \
            python3.11 python3.11-dev python3-pip \
            autoconf automake libtool pkg-config cmake ninja-build \
            zlib1g-dev libffi-dev libssl-dev libsqlite3-dev \
            build-essential ccache git zip unzip wget curl gettext \
            patchelf

          # Pin 'python3' and 'python' to 3.11 (matches Dockerfile intent)
          sudo update-alternatives \
            --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          sudo update-alternatives \
            --install /usr/bin/python  python  /usr/bin/python3.11 1

          echo "=== Toolchain versions ==="
          python3 --version
          java   -version
          cmake  --version | head -1
          ccache --version | head -1

      # ── 2 · Android SDK + NDK ─────────────────────────────────────────────
      - name: "2 · Android SDK + NDK"
        script: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d /tmp/ct_unpack
          mv /tmp/ct_unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -f /tmp/ct.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Some licence prompts require two passes to fully accept
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;33.0.0" \
            "platforms;android-33" \
            "ndk;25.1.8937393"

          echo "NDK path  : $ANDROID_NDK_HOME"
          echo "NDK exists: $(ls $ANDROID_NDK_HOME | head -3)"

      # ── 3 · Clean Room ────────────────────────────────────────────────────
      # Wipe every artefact directory before building.  This prevents stale
      # .so files, broken recipe stamps, and half-built Python distributions
      # from corrupting the new build.
      - name: "3 · Clean Room — wipe all stale artefacts"
        script: |
          set -euo pipefail

          echo "--- Project-level build artefacts ---"
          rm -rf ./build ./.python-for-android ./dist ./bin

          echo "--- Gradle and Android caches ---"
          rm -rf ~/.gradle/caches ~/.android/build-cache 2>/dev/null || true

          echo "--- pip wheel cache ---"
          pip cache purge 2>/dev/null || true

          echo "Clean room ready."

      # ── 4 · Pre-install Python build stack (globally) ─────────────────────
      # All packages are installed into system Python BEFORE p4a runs.
      # Because PIP_NO_BUILD_ISOLATION=1 is inherited by every subprocess,
      # all recipe builds see Cython, setuptools, etc. without isolation.
      - name: "4 · Pre-install Python build stack"
        script: |
          set -euo pipefail

          # Pin the base toolchain
          python3 -m pip install --upgrade \
            "pip==24.0" \
            "setuptools==70.3.0" \
            "wheel==0.43.0"

          # Cython MUST be globally visible before p4a runs any recipe.
          # kivy, pyjnius, and several other recipes call Cython during build.
          pip install "Cython==${CYTHON_VERSION}"

          # pyjnius has its own Cython extension; pre-installing here avoids
          # p4a trying to discover Cython inside an isolated env for it.
          pip install "pyjnius>=1.6.1"

          # Install p4a at the pinned, known-good version.
          pip install "python-for-android==${P4A_VERSION}"

          # ── Sanity checks ─────────────────────────────────────────────
          echo "=== Build stack versions ==="
          python3 -c "import Cython;     print('Cython    :', Cython.__version__)"
          python3 -c "import setuptools; print('setuptools:', setuptools.__version__)"
          p4a --version
          echo "cython binary : $(which cython)"
          echo "PIP_NO_BUILD_ISOLATION=${PIP_NO_BUILD_ISOLATION}"

      # ── 5 · Build debug APK ───────────────────────────────────────────────
      - name: "5 · Build debug APK"
        script: |
          set -euo pipefail

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.0:$PATH"

          python3 -m pythonforandroid.toolchain apk \
            \
            `# ── App identity ──────────────────────────────────────────` \
            --private         ./ \
            --package         com.soccerstars.analyzer \
            --name            "Soccer Stars Analyzer" \
            --version         "1.0.0" \
            --numeric-version 1 \
            \
            `# ── Bootstrap & requirements ──────────────────────────────` \
            --bootstrap       sdl2 \
            --requirements    "python3==3.11,kivy==${KIVY_VERSION},pyjnius,numpy==${NUMPY_VERSION},opencv" \
            \
            `# ── Custom recipes override: OpenCV uses prebuilt SDK ─────` \
            `# p4a checks ./p4a_recipes/ before its own built-in recipes.` \
            `# opencv recipe: copies prebuilt .so, compiles only cv2.so.` \
            --local-recipes   ./p4a_recipes \
            \
            `# ── Pre-built wheels: skip numpy cross-compilation ────────` \
            --wheels          ./wheels \
            \
            `# ── Architecture & API levels ─────────────────────────────` \
            --arch            arm64-v8a \
            --android-api     "${ANDROIDAPI}" \
            --ndk-api         "${ANDROIDNDKAPI}" \
            \
            `# ── Explicit SDK / NDK paths (no env-var guessing) ────────` \
            --sdk-dir         "${ANDROID_SDK_ROOT}" \
            --ndk-dir         "${ANDROID_NDK_HOME}" \
            --build-tools-version 33.0.0 \
            \
            `# ── Background capture service ────────────────────────────` \
            --service         SoccerStarsCapture:./service/main.py \
            \
            `# ── Android permissions ────────────────────────────────────` \
            --permission      FOREGROUND_SERVICE \
            --permission      FOREGROUND_SERVICE_MEDIA_PROJECTION \
            --permission      "android.permission.SYSTEM_ALERT_WINDOW" \
            --permission      "android.permission.RECORD_AUDIO" \
            --permission      "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" \
            \
            --accept-sdk-license \
            --debug \
            \
            2>&1 | tee build.log

    artifacts:
      - "dist/*.apk"
      - "build.log"

  # ═══════════════════════════════════════════════════════════════════════════
  # Release workflow — signed APK
  # ═══════════════════════════════════════════════════════════════════════════
  android-release:
    name: "Soccer Stars — Android Release (Signed)"
    instance_type: linux
    max_build_duration: 120

    environment:
      vars:
        # ── Toolchain (identical to debug workflow) ─────────────────────────
        ANDROID_HOME:         /home/user/android-sdk
        ANDROID_SDK_ROOT:     /home/user/android-sdk
        ANDROID_NDK_HOME:     /home/user/android-sdk/ndk/25.1.8937393
        ANDROIDNDK:           /home/user/android-sdk/ndk/25.1.8937393
        ANDROIDAPI:           "33"
        ANDROIDMINAPI:        "26"
        ANDROIDNDKAPI:        "26"
        ANDROID_NDK_API:      "26"
        CYTHON_VERSION:       "3.0.10"
        P4A_VERSION:          "2024.1.21"
        KIVY_VERSION:         "2.3.0"
        NUMPY_VERSION:        "1.26.4"
        P4A_FORCE_YES:              "1"
        P4A_NO_PREREQUISITE_CHECK:  "1"
        PIP_NO_BUILD_ISOLATION: "1"
        PIP_FIND_LINKS:       "./wheels"
        USE_CCACHE:           "1"
        CCACHE_DIR:           "/tmp/ccache"
        JAVA_HOME:            /usr/lib/jvm/java-17-openjdk-amd64

      # ── Signing credentials ─────────────────────────────────────────────
      # Add these as ENCRYPTED variables in the Codemagic UI:
      #   Environment variables → Secure group
      # Required keys:
      #   KEYSTORE_PATH      path to your .jks / .keystore file
      #                      (upload the file via CM_KEYSTORE file reference)
      #   KEYSTORE_PASSWORD  keystore password
      #   KEY_ALIAS          signing key alias
      #   KEY_PASSWORD       key password
      # NEVER hard-code these values here.

    scripts:

      - name: "1 · System packages"
        script: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk \
            python3.11 python3.11-dev python3-pip \
            autoconf automake libtool pkg-config cmake ninja-build \
            zlib1g-dev libffi-dev libssl-dev libsqlite3-dev \
            build-essential ccache git zip unzip wget curl gettext patchelf
          sudo update-alternatives \
            --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          sudo update-alternatives \
            --install /usr/bin/python  python  /usr/bin/python3.11 1
          python3 --version && java -version

      - name: "2 · Android SDK + NDK"
        script: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d /tmp/ct_unpack
          mv /tmp/ct_unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -f /tmp/ct.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;33.0.0" \
            "platforms;android-33" \
            "ndk;25.1.8937393"

      - name: "3 · Clean Room"
        script: |
          set -euo pipefail
          rm -rf ./build ./.python-for-android ./dist ./bin
          rm -rf ~/.gradle/caches ~/.android/build-cache 2>/dev/null || true
          pip cache purge 2>/dev/null || true
          echo "Clean room ready."

      - name: "4 · Pre-install Python build stack"
        script: |
          set -euo pipefail
          python3 -m pip install --upgrade \
            "pip==24.0" "setuptools==70.3.0" "wheel==0.43.0"
          pip install "Cython==${CYTHON_VERSION}"
          pip install "pyjnius>=1.6.1"
          pip install "python-for-android==${P4A_VERSION}"
          python3 -c "import Cython; print('Cython:', Cython.__version__)"
          p4a --version

      - name: "5 · Build release APK"
        script: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.0:$PATH"

          python3 -m pythonforandroid.toolchain apk \
            --private         ./ \
            --package         com.soccerstars.analyzer \
            --name            "Soccer Stars Analyzer" \
            --version         "1.0.0" \
            --numeric-version 1 \
            --bootstrap       sdl2 \
            --requirements    "python3==3.11,kivy==${KIVY_VERSION},pyjnius,numpy==${NUMPY_VERSION},opencv" \
            --local-recipes   ./p4a_recipes \
            --wheels          ./wheels \
            --arch            arm64-v8a \
            --android-api     "${ANDROIDAPI}" \
            --ndk-api         "${ANDROIDNDKAPI}" \
            --sdk-dir         "${ANDROID_SDK_ROOT}" \
            --ndk-dir         "${ANDROID_NDK_HOME}" \
            --build-tools-version 33.0.0 \
            --service         SoccerStarsCapture:./service/main.py \
            --permission      FOREGROUND_SERVICE \
            --permission      FOREGROUND_SERVICE_MEDIA_PROJECTION \
            --permission      "android.permission.SYSTEM_ALERT_WINDOW" \
            --permission      "android.permission.RECORD_AUDIO" \
            --permission      "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" \
            --accept-sdk-license \
            --release \
            2>&1 | tee build.log

      - name: "6 · Sign APK"
        script: |
          set -euo pipefail

          APK=$(find dist/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found in dist/" && exit 1
          fi

          echo "Signing: $APK"
          "$ANDROID_HOME/build-tools/33.0.0/apksigner" sign \
            --ks              "$KEYSTORE_PATH" \
            --ks-pass         "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias    "$KEY_ALIAS" \
            --key-pass        "pass:${KEY_PASSWORD}" \
            --out             dist/SoccerStarsAnalyzer-release-signed.apk \
            "$APK"

          "$ANDROID_HOME/build-tools/33.0.0/apksigner" verify \
            dist/SoccerStarsAnalyzer-release-signed.apk
          echo "APK signed and verified."

    artifacts:
      - "dist/*-signed.apk"
      - "build.log"
